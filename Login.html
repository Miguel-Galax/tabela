<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Login</title>
<style>
    body{background-color: aqua;}
    label{ 
        text-align: center;}
        
</style>
 <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1>Login</h1>
    <div class="login-container"></div>
    <!-- O action deve levar a um backend (ex: login.php) em produção -->
    <form action="Receitas.html">
        <div=class"input-group">
            <label for="fname">Nome:</label><br>
            <input type="text" id="fname" name="fname" required><br>
            
            <label for="lname">Senha:</label><br>
        <!-- type="password" oculta os caracteres -->
         <input type="password" id="lname" name="lname" required><br><br>
         
         <label for="ftele">Telefone:</label><br>
         <input type="tel" id="ftele" name="ftele"><br>
        
         <label for="femail">Email:</label><br>
        <!-- type="email" valida o formato -->
         <input type="email" id="femail" name="femail" required><br><br>
        </div>
        <input type="submit" value="Enviar">
    </form>
</body>
</html>
